name: Full-Stack CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # --------------------------------------------------------
  # Job 1: C++ Unit Tests & Python E2E TCP Tests
  # --------------------------------------------------------
  cpp-and-tcp-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and run C++ unit tests
        run: |
          docker build --target builder -t recommendation-tester .
          docker run --rm recommendation-tester ./build/run_tests

      - name: Run Python E2E TCP integration tests
        run: |
          docker compose up --build --abort-on-container-exit --exit-code-from python-tests python-tests
          docker compose down -v

  # --------------------------------------------------------
  # Job 2: Node.js API Integration Tests (158 Tests)
  # --------------------------------------------------------
  node-api-tests:
    runs-on: ubuntu-latest
    
    # temp data base 
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-server/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./web-server
        run: npm ci

      - name: Run Jest API Test Suite
        working-directory: ./web-server
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/food_delivery_test_db
          JWT_SECRET: test_secret_key_12345
        run: npm test

  # --------------------------------------------------------
  # Job 3: Verify Full Docker Compose Production Build
  # --------------------------------------------------------
  docker-build-check:
    runs-on: ubuntu-latest
    needs: [cpp-and-tcp-tests, node-api-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build all production Docker images
        run: docker compose build